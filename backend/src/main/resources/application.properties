# ===================================================================
# GLOWORA BEAUTY & COSMETICS - LOCAL DEVELOPMENT CONFIGURATION
# ===================================================================
spring.application.name=glowora-backend
server.port=8080

# PostgreSQL Database Connectivity (Local Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/glowora_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:MEENU}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA & Hibernate Settings (Local Development Only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Session Cookie Settings for Local Development
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=GLOWORA_SESSION

# Jackson Serialization Settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Error Handling Settings (Never expose stacktraces in API responses)
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always

# Initial Administrator Bootstrap Credentials (Environment-Configurable, BCrypt Hashed on Startup)
glowora.admin.name=${ADMIN_NAME:Glowora Administrator}
glowora.admin.email=${ADMIN_EMAIL:admin@glowora.com}
glowora.admin.password=${ADMIN_PASSWORD:Admin@Glowora2026}
glowora.admin.phone=${ADMIN_PHONE:9800000001}

# Serve frontend static files directly when accessed on http://localhost:8080/
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:frontend/


